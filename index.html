<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon"  href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
    rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Short Circuit Arena" />
    <meta name="description" content="Compete in online esports tournaments and leagues with Short Circuit Arena. Find teams, follow matches, and join the SCA gaming community." />
    <meta name="theme-color" content="#101014" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Short Circuit Arena" />
    <meta property="og:title" content="Short Circuit Arena | Compete. Conquer. Make history." />
    <meta property="og:description" content="Online esports tournaments and leagues for competitive gamers, teams, and communities." />
    <meta property="og:url" content="https://sca.gg/" />
    <meta property="og:image" content="https://sca.gg/assets/sca_logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://sca.gg/" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sca-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <title>Short Circuit Arena | Esports Tournaments &amp; Leagues</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
